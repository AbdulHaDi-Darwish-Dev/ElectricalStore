name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ElectricalStore.sln

      - name: Build (Release)
        run: dotnet build ElectricalStore.sln -c Release --no-restore

      - name: Test Domain + Application
        run: |
          dotnet test tests/ElectricalStore.Domain.Tests/ElectricalStore.Domain.Tests.csproj -c Release --no-build --verbosity minimal
          dotnet test tests/ElectricalStore.Application.Tests/ElectricalStore.Application.Tests.csproj -c Release --no-build --verbosity minimal

      - name: Test Infrastructure + Integration (Docker / Testcontainers)
        run: |
          dotnet test tests/ElectricalStore.Infrastructure.Tests/ElectricalStore.Infrastructure.Tests.csproj -c Release --no-build --verbosity minimal
          dotnet test tests/ElectricalStore.IntegrationTests/ElectricalStore.IntegrationTests.csproj -c Release --no-build --verbosity minimal

  frontend:
    name: Frontend typecheck lint test build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          API_BASE_URL: http://127.0.0.1:5180
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:5180
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

  # Playwright E2E requires a running local/API stack — not in default CI.
  # Run manually: cd frontend && npm run test:e2e
