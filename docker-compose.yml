services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ElectricalStore-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_DevOnly_Password123}"
    ports:
      - "1433:1433"
    volumes:
      - ElectricalStore_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD:-Your_strong_DevOnly_Password123}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Example API service logging (enable when you containerize the API).
  # Logs go to stdout/stderr; host/Docker rotates — do not rely on an ephemeral container filesystem.
  # api:
  #   image: electricalstore-api:latest
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "5"

volumes:
  ElectricalStore_sql_data:
